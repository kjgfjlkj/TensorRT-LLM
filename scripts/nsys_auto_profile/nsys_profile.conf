# =========================================================
# nsys_profile.conf — Edit this file to configure your profiling run.
# All other settings live in nsys_profile.sh (do not edit unless extending).
# =========================================================

# =========================================================
# SECTION 1: Machine definitions
# Add/remove machine types and their host lists as needed.
# Format: MACHINE_LISTS["type"]="user@host1 user@host2 ..."
# =========================================================
declare -A MACHINE_LISTS
MACHINE_LISTS["h100_8gpu"]="user@h100-server1.company.com user@h100-server2.company.com"
MACHINE_LISTS["a100_8gpu"]="user@a100-server1.company.com"
MACHINE_LISTS["h100_16gpu"]="user@h100-16gpu.company.com"
# Add more machine types here...

# =========================================================
# SECTION 2: Target configuration
# =========================================================
MACHINE_TYPE="h100_8gpu"      # Must match a key in MACHINE_LISTS above
NUM_GPUS=4                    # GPUs needed (power of 2: 1, 2, 4, 8, 16)
TOTAL_GPUS_PER_NODE=8         # Total GPUs per node for this machine type

# =========================================================
# SECTION 3: Docker configuration
# =========================================================
DOCKER_CONTAINER_NAME="trtllm_dev"  # Name of the existing container to exec into

# =========================================================
# SECTION 4: Environment configuration
# =========================================================
ENV_SETUP_SCRIPT="/workspace/setup_env.sh"  # Sourced inside the container before commands

# =========================================================
# SECTION 5: Server configuration
# =========================================================
SERVER_CMD="trtllm-serve meta-llama/Llama-3.1-8B-Instruct --tp_size 4 --port 8000"
SERVER_PORT=8000
SERVER_STARTUP_TIMEOUT=300   # Seconds to wait for the server to become ready

# =========================================================
# SECTION 6: Client configuration
# =========================================================
CLIENT_CMD="python3 /workspace/benchmark_serving.py --port 8000 --num-requests 100"

# =========================================================
# SECTION 7: nsys configuration
# =========================================================
NSYS_OPTS="-t cuda --cuda-graph-trace=node --trace-fork-before-exec=true -f true"
NSYS_OUTPUT_NAME="nsys_report"  # Base name; a timestamp is automatically appended

# =========================================================
# SECTION 8: Output directory (network share accessible from all target machines)
# =========================================================
OUTPUT_BASE_DIR="/mnt/shared/nsys_profiles"

# =========================================================
# SECTION 9: SSH configuration
# =========================================================
SSH_KEY="${HOME}/.ssh/id_rsa"
SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=10 -o BatchMode=yes"

# =========================================================
# SECTION 10: Polling configuration
# =========================================================
GPU_POLL_INTERVAL=30   # Seconds between GPU availability checks
GPU_FREE_MEM_MB=100    # GPUs with used memory below this threshold are considered free
GPU_FREE_UTIL=0        # GPUs with utilization equal to this value are considered free
